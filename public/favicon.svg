<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#04091a" stroke="url(#neonGrad)" stroke-width="2.5" />
  <!-- Abstract Geometric Neural Node -->
  <g filter="url(#glow)">
    <polygon points="50,22 76,37 76,67 50,82 24,67 24,37" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-linejoin="round" />
    <polygon points="50,33 65,42 65,60 50,69 35,60 35,42" fill="none" stroke="#00f5d4" stroke-width="2" stroke-linejoin="round" opacity="0.8" />
    <circle cx="50" cy="51" r="5" fill="#00f5d4" />
    <circle cx="76" cy="37" r="3" fill="#3b82f6" />
    <circle cx="24" cy="67" r="3" fill="#a855f7" />
  </g>
</svg>
